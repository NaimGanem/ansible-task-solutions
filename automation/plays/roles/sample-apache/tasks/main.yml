---
- name: Install packages
  package:
    name:
      - httpd
      - mod_ssl
      - php
    state: present

- name: Start and enable Apache
  service:
    name: httpd
    state: started
    enabled: true

- name: Open HTTP service
  firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Open HTTPS service
  firewalld:
    service: https
    permanent: true
    state: enabled
    immediate: true

- name: Deploy index.html
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: restart apache
