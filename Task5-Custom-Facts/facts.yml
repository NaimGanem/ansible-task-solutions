---
- name: Create custom fact
  hosts: database
  become: true

  tasks:
    - name: Create facts directory
      file:
        path: /etc/ansible/facts.d
        state: directory

    - name: Create custom fact file
      copy:
        dest: /etc/ansible/facts.d/custom.fact
        content: |
          [sample_exam]
          server_role=mysql

    - name: Reload facts
      setup:
        filter: ansible_local
