# Task 4 - HAProxy Solution
---
- name: Configure HAProxy
  hosts: proxy
  become: true

  vars:
    haproxy_frontend_port: 80
    haproxy_backend_name: habackend
    haproxy_backend_balance_method: roundrobin
    haproxy_backend_httpchk: ""
    haproxy_backend_servers:
      - name: web1
        address: 192.168.122.23:80
      - name: web2
        address: 192.168.122.129:80

  pre_tasks:
    - name: Open HTTP firewall port
      firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

  roles:
    - geerlingguy.haproxy
